[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dome-rag"
version = "0.1.0"
description = "Grounded local retrieval and context assembly for the Dome knowledge base"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
semantic = ["fastembed>=0.9,<0.10"]

[project.scripts]
dome-rag = "rag.cli:main"

[tool.setuptools]
packages = ["rag"]
