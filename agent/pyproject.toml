[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kupol"
version = "0.1.0"
description = "Каркас системы «Штаб» для соревнования «Лига автономных систем — Купол»"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6",
    "httpx>=0.27",
    "rich>=13",
    "streamlit>=1.35",
    "websockets>=12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "mypy>=1.10",
    "types-PyYAML",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kupol = ["agents/prompts/*.md", "agents/prompts/examples/*.md", "agents/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not slow'"
markers = ["slow: полные игры на симуляторе (минуты); по умолчанию пропускаются, запуск: pytest -m slow или pytest -m 'slow or not slow'"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src/kupol"]

[tool.coverage.run]
source = ["src/kupol"]
