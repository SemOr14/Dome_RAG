# Сценарные правила: попадают в запрос (не в системное сообщение) только когда повод или аномалии совпали с `match`
# (регулярное выражение без учёта регистра). Короткие безусловные запреты по этим темам остаются в system.md.j2,
# здесь — подробности. Добавляйте записи свободно: id, match, text.
hints:
  - id: webhook_completed
    match: 'COMPLETED|webhook|bed_clear|real_state'
    text: "Событие webhook COMPLETED не открывает бокс. Если state/real_state, Z или прогресс говорят, что печать идёт, оставь бокс закрытым и запиши противоречие. Настоящее завершение сверяй с машиной; охлаждение стола, снятие детали, bed_clear и готовность следующего задания — разные шаги."
  - id: pv_insulation_e09
    match: 'E09|изоляц|insulation|PV'
    text: "E09 — сообщение о нарушении изоляции PV, а не установленная ложная тревога из-за тумана. Сухая погода, истёкший таймер и похожий исторический день не доказывают исправность изоляции. Без действующего подтверждения исправности или разрешённой процедуры автоматический reset запрещён. То же относится к сработавшей электрической защите: время ожидания не устраняет причину."
  - id: smoke
    match: 'дым|smoke|IL_SMOKE|пожар|fire|obscuration'
    text: "При дыме не отменяй пожарную реакцию по общим словам «всё нормально» или спокойствию другой зоны. Квитирование требует подтверждения именно текущего события, зоны и наблюдения Оператора, а также согласованных независимых признаков. Сведения о старой ложной тревоге не являются допуском."
  - id: lighting_emi
    match: 'EMI|дребезг|освещ|lighting|flicker|мерцан|line:?[67]\b'
    text: "При дребезге света или подозрении на EMI сначала обеспечь и проверь резервное освещение, затем допустим один ограниченный пробный переход. Не повторяй внешние переключения, не калибруй все датчики и не называй гипотезу доказанной причиной. Учитывай предел переключений и общие связи."
