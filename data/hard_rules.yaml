# Жёсткие правила и права агента. Источник — 01_API.md §7, 02_Задание_и_оценка.md, журналы смен.
# `text` попадает в промпт. `check` — имя машинной проверки в agent/validate.py
# (действие, нарушающее правило, отклоняется до исполнения). Правила без `check` проверяет только модель.

limits:
  line_switch_max: 3            # переключений одной линии ...
  line_switch_window_s: 120     # ... за это окно → блокировка линии на 5 мин
  resume_attempts_max: 2        # третья пустая попытка resume → ALARM 20 мин
  block_interlock_max_min: 30
  message_max_chars: 4000

permissions:
  - "Агент выполняет только действия из `controls` каталога узла (describe_nodes — главный источник прав)."
  - "Действия из `operator_controls` выполняет только Оператор руками — агент может лишь попросить в meeting_01."
  - "Агент не может ставить станки на паузу, прерывать задания и отправлять произвольный G-code."
  - "Двери боксов открывает только Оператор и только при открытом замке."
  - "Переключение основного сетевого канала, замена патчкорда, чистка фильтров, снятие детали, замена катушки — физические действия Оператора."
  - "Узлы только для чтения (пустой `controls`) не управляются."

rules:
  - id: R01
    text: "Не делать resume, пока причина удержания не устранена: интерлок hold_reason в состоянии TRIPPED, FILAMENT_RUNOUT, lockout. Сначала устранить причину и убедиться по телеметрии."
    check: resume_requires_cause_cleared
  - id: R02
    text: "Не больше 2 пустых попыток resume: третья → ALARM на 20 минут, у принтера задание отменяется."
    check: resume_attempts_limit
  - id: R03
    text: "Не запускать печать при bed_clear=false — столкновение с деталью (BED_COLLISION, ALARM 20 мин)."
    check: printer_bed_clear
  - id: R04
    text: "Не запускать задание на станке, который уже работает или на паузе; start_job — только по имени файла из `files`."
    check: start_job_state
  - id: R05
    text: "Не открывать замок бокса thermal_insulation_01 во время печати."
    check: box_lock_during_print
  - id: R06
    text: "Не больше 3 переключений одной линии щитка за 2 минуты; заблокированной линии (lockout_remaining_s > 0) команды не отправлять; сработавшую защиту взводить reset_protection, а не line_on."
    check: line_switching
  - id: R07
    text: "reset_interlock по ложным данным — только после set_data_trust (UNRELIABLE/FAILED) или set_primary_sensor на исправный датчик. Настоящую тревогу не снимать и не блокировать."
    check: interlock_reset_requires_trust
  - id: R08
    text: "block_interlock — не дольше 30 минут и только при доказанной ложности источника."
    check: block_interlock_limit
  - id: R09
    text: "Загружать на принтер только файлы, подготовленные организаторами (upload_file запрещён агенту без явного задания)."
    check: no_upload
  - id: R10
    text: "Не повторять одну и ту же команду без проверки результата по телеметрии; в одном плане — без дублей."
    check: no_duplicates
  - id: R11
    text: "success=true значит «принято», а не «сделано»: каждое действие должно иметь ожидаемый результат (expected) для проверки."
  - id: R12
    text: "Ложной считается тревога, если ей противоречат ≥2 независимых источника, физика или данные застыли (status=UNKNOWN, неизменный updated_at). Реальный рост CO2 виден на всех трёх датчиках сразу (с учётом reading_delay_s)."
  - id: R13
    text: "Безопасность важнее задания: не работать без вытяжки при пайке, не допускать духоты (CO2), не обесточивать купол."
  - id: R14
    text: "Не отключать исправное оборудование и не делать сбросы защиты без понимания причины."
  - id: R15
    text: "К Оператору — только когда без его рук не обойтись или ему нужно знать о риске: коротко, что/где/зачем. Не просить подтвердить то, что видно по данным. Не писать Оператору других команд."
    check: operator_message_length
  - id: R16
    text: "webhook_state=COMPLETED при длинной печати может врать: завершение подтверждать по state, progress_pct и z_mm."
  - id: R17
    text: "Опасные действия (manual_start_zone, lockdown, reboot, отключение линии 7 аварийного света) — только при подтверждённой угрозе с несколькими доказательствами."
    check: dangerous_actions
